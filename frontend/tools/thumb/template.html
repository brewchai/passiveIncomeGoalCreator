<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;font-weight:400 800;font-display:block;src:url('__FONT__') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:675px;overflow:hidden}
.card{position:relative;width:1200px;height:675px;font-family:Manrope,sans-serif;
  background:radial-gradient(120% 90% at 78% 15%, #2A211C 0%, #14110E 62%)}
.ph{position:absolute;inset:0;background-image:__BGIMAGE__;background-size:__ZOOM__;background-position:__POS__;background-repeat:no-repeat}
.scrim{position:absolute;inset:0;background:linear-gradient(__ANGLE__,
  rgba(20,17,14,.94) 0%, rgba(20,17,14,.80) 36%, rgba(20,17,14,.14) 70%, rgba(20,17,14,0) 100%)}
.txt{position:absolute;inset:0;padding:66px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:__ALIGN__;text-align:__TALIGN__}
.inner{max-width:63%}
.eyebrow{font-size:20px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#D26C79;margin-bottom:20px}
.hook{font-size:__SIZE__px;line-height:1.06;font-weight:600;letter-spacing:-.026em;color:#F4EFE9}
.hook em{font-style:normal;color:#D26C79}
.foot{margin-top:26px;font-size:21px;font-weight:700;color:#B9ACA1;letter-spacing:.01em}
</style></head><body>
<div class="card">
  <div class="ph"></div>
  <div class="scrim"></div>
  <div class="txt"><div class="inner">
    <div class="eyebrow">__EYEBROW__</div>
    <div class="hook">__HOOK__</div>
    <div class="foot">butfirstfire.com</div>
  </div></div>
</div></body></html>
